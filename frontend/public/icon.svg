<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Black/Dark Slate) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272A" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <!-- Shadow Filter for Camera -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- App Icon Background (Rounded Rect) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Video Camera Icon -->
  <g filter="url(#shadow)" transform="translate(112, 128)">
    <!-- Camera Body -->
    <rect x="0" y="32" width="180" height="192" rx="36" fill="#FFFFFF" />
    
    <!-- Camera Lens / Front -->
    <path d="M180,96 L256,48 L256,208 L180,160 Z" fill="#FFFFFF" stroke-linejoin="round" stroke-linecap="round" />
    
    <!-- Inner Accent Dot -->
    <circle cx="90" cy="128" r="24" fill="#09090B" opacity="0.9" />
  </g>
</svg>